<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAL FOOTBALL · 프랑스 vs 아르헨티나</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111b;color:#eef7ff;font-family:system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:#0c1b2b;border-bottom:1px solid #29445b;flex-wrap:wrap}h1{font-size:clamp(18px,3vw,27px);margin:0;letter-spacing:1px;color:#9fffd0}.score{font-size:clamp(20px,4vw,32px);font-weight:900}.score small{font-size:12px;color:#9fb4c7;display:block;text-align:center}.wrap{max-width:1100px;margin:auto;padding:16px}canvas{display:block;width:100%;background:#167b45;border:3px solid #d8e7df;border-radius:12px;box-shadow:0 15px 45px #0008;touch-action:none}.info{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#b8ccdc;font-size:13px;margin:12px 2px}.panel{background:#102337;border:1px solid #2b4a63;border-radius:14px;padding:14px;margin-top:12px;line-height:1.65}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{background:#1b3850;color:white;border:1px solid #47718d;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}button.primary{background:#a8ffd2;color:#062416;border:0}a{color:#9fffd0}.touch{display:none;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:12px}.touch button{height:48px;padding:0;font-size:18px}.touch .actions{grid-column:1/-1;display:flex;justify-content:center;gap:8px}.touch .actions button{min-width:82px}@media(max-width:650px){.touch{display:grid}.wrap{padding:9px}}
</style></head><body>
<header><h1>⚽ REAL FOOTBALL</h1><div class="score"><small>FRANCE</small><span id="sc">0 - 0</span><small>ARGENTINA</small></div><div id="clock">90:00</div></header>
<div class="wrap"><canvas id="pitch" width="1000" height="620" aria-label="축구 경기장"></canvas>
<div class="info"><span id="status">킥오프 준비 완료</span><span>프랑스 공격 · 파란색 팀 조작</span></div>
<div class="controls"><button class="primary" id="start">경기 시작</button><button id="pause">일시정지</button><button id="reset">다시 시작</button><button id="home">홈으로</button></div>
<div class="panel"><b>조작 방법</b><br>이동: WASD 또는 방향키 · 패스: J · 슛: K · 질주: Shift · 선수 변경: Q<br>공을 가진 선수는 공을 몰고, 상대 선수들은 자동으로 압박해. 골을 넣어 승리해 봐!</div>
<div class="touch"><button data-key="ArrowUp">▲</button><span></span><button data-key="j">패스</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><div class="actions"><button data-key="k">슛</button><button data-key="Shift">질주</button><button data-key="q">선수 변경</button></div></div>
</div>
<script>
const c=document.getElementById('pitch'),x=c.getContext('2d'),W=c.width,H=c.height,scoreEl=document.getElementById('sc'),clockEl=document.getElementById('clock'),statusEl=document.getElementById('status');
const keys={};let running=false,started=false,last=0,elapsed=0,goals=[0,0],players=[],ball={},active=0,flash=0;
const namesA=['MBAPPE','GRIEZMANN','DEMBELE','TCHOUAMENI','KANTE','THEO','KONATE','KOUNDÉ','SALIBA','MAIGNAN'];
const namesB=['MESSI','DI MARIA','ALVAREZ','DE PAUL','ENZO','MAC ALLISTER','TAGLIAFICO','ROMERO','OTAMENDI','MARTINEZ'];
function makeTeam(team){let arr=[];for(let i=0;i<10;i++){let attack=team===0;let col=attack?'#2268e8':'#f5f5f5';let row=Math.floor(i/2),side=i%2?1:-1;let px=attack?210+row*65:790-row*65;let py=H/2+side*(row%2?100:38)+(i%3)*12;arr.push({team,x:px,y:py,vx:0,vy:0,homeX:px,homeY:py,r:15,name:(attack?namesA:namesB)[i],col,number:i+1})}return arr}
function reset(){players=[...makeTeam(0),...makeTeam(1)];active=0;ball={x:W/2,y:H/2,vx:0,vy:0,owner:-1};goals=[0,0];elapsed=0;scoreEl.textContent='0 - 0';clockEl.textContent='90:00';statusEl.textContent='킥오프 준비 완료';running=false;started=false;draw()}
function nearest(team){let best=-1,d=1e9;players.forEach((p,i)=>{if(p.team!==team)return;let z=Math.hypot(p.x-ball.x,p.y-ball.y);if(z<d){d=z;best=i}});return best}
function own(){return ball.owner>=0?players[ball.owner]:null}
function movePlayer(p,dx,dy,speed){let m=Math.hypot(dx,dy)||1;p.vx+=(dx/m)*speed;p.vy+=(dy/m)*speed;p.x+=p.vx;p.y+=p.vy;p.vx*=.78;p.vy*=.78;p.x=Math.max(35,Math.min(W-35,p.x));p.y=Math.max(35,Math.min(H-35,p.y))}
function update(dt){if(!running)return;elapsed+=dt;if(elapsed>=90){elapsed=90;running=false;statusEl.textContent='경기 종료! '+(goals[0]>goals[1]?'프랑스 승리':goals[0]<goals[1]?'아르헨티나 승리':'무승부');}
clockEl.textContent=String(Math.floor(elapsed)).padStart(2,'0')+':'+String(Math.floor((elapsed%1)*60)).padStart(2,'0');
let p=players[active],o=own();let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);let speed=keys.Shift?3.7:2.65;
if(dx||dy){movePlayer(p,dx,dy,speed);if(ball.owner===active){ball.x=p.x+dx*22;ball.y=p.y+dy*22}}
players.forEach((q,i)=>{if(i===active)return;let targetX=q.homeX,targetY=q.homeY;if(q.team===1){let chase=nearest(1);if(chase===i){targetX=ball.x+(ball.x>W/2?-22:22);targetY=ball.y}}else if(ball.owner===i){targetX=ball.x+70;targetY=ball.y}let ax=targetX-q.x,ay=targetY-q.y,dist=Math.hypot(ax,ay);if(dist>12)movePlayer(q,ax,ay,Math.min(1.8,dist*.025));});
if(ball.owner<0){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.985;ball.vy*=.985;if(ball.y<22||ball.y>H-22)ball.vy*=-.8;if(ball.x<20||ball.x>W-20){if(ball.y>H/2-75&&ball.y<H/2+75){let team=ball.x<20?1:0;goals[team]++;scoreEl.textContent=goals[0]+' - '+goals[1];statusEl.textContent=(team===0?'프랑스':'아르헨티나')+' 골!';ball={x:W/2,y:H/2,vx:0,vy:0,owner:-1};players.forEach(q=>{q.x=q.homeX;q.y=q.homeY});}else{ball.x=Math.max(25,Math.min(W-25,ball.x));ball.vx*=-.7}}}
players.forEach((q,i)=>{if(ball.owner<0&&Math.hypot(q.x-ball.x,q.y-ball.y)<q.r+9){ball.owner=i;active=q.team===0?i:active;}});if(ball.owner>=0){let holder=players[ball.owner];ball.x=holder.x+18;ball.y=holder.y;}
}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#167b45';x.fillRect(0,0,W,H);for(let i=0;i<10;i++){x.fillStyle=i%2?'#ffffff08':'#001b1008';x.fillRect(i*100,0,100,H)}x.strokeStyle='#e8f6e9';x.lineWidth=3;x.strokeRect(18,18,W-36,H-36);x.beginPath();x.moveTo(W/2,18);x.lineTo(W/2,H-18);x.stroke();x.beginPath();x.arc(W/2,H/2,85,0,Math.PI*2);x.stroke();x.strokeRect(18,H/2-130,135,260);x.strokeRect(W-153,H/2-130,135,260);x.strokeRect(18,H/2-65,48,130);x.strokeRect(W-66,H/2-65,48,130);x.fillStyle='#fff';x.fillRect(0,H/2-76,18,152);x.fillRect(W-18,H/2-76,18,152);
players.forEach((p,i)=>{x.beginPath();x.fillStyle=p.col;x.shadowColor=p.team===0?'#73aaff':'#fff';x.shadowBlur=i===active?18:7;x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.shadowBlur=0;x.strokeStyle=i===active?'#ffe66b':'#dce8ef';x.lineWidth=i===active?4:1.5;x.stroke();x.fillStyle=p.team===0?'#fff':'#1b2732';x.font='bold 9px system-ui';x.textAlign='center';x.fillText(p.number,p.x,p.y+3);x.fillStyle='#fff';x.font='bold 10px system-ui';x.fillText(p.name,p.x,p.y-23);});x.beginPath();x.fillStyle='#fff';x.shadowColor='#fff';x.shadowBlur=8;x.arc(ball.x,ball.y,8,0,Math.PI*2);x.fill();x.shadowBlur=0;if(!running){x.fillStyle='#04130cb0';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 32px system-ui';x.fillText(started?'일시정지':'REAL FOOTBALL',W/2,H/2-10);x.font='16px system-ui';x.fillText(started?'계속하려면 경기 시작':'경기 시작을 눌러 킥오프!',W/2,H/2+25)}}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function kick(power){if(!running)return;let p=players[active];if(ball.owner!==active){if(Math.hypot(ball.x-p.x,ball.y-p.y)<55)ball.owner=active;else return}let goalX=W-15,goalY=H/2,ang=Math.atan2(goalY-p.y,goalX-p.x);ball.owner=-1;ball.x=p.x+20;ball.y=p.y;ball.vx=Math.cos(ang)*power;ball.vy=Math.sin(ang)*power+(Math.random()-.5)*1.8;statusEl.textContent=power>8?'강력한 슛!':'패스!'}
function start(){running=true;started=true;statusEl.textContent='경기 진행 중';}
window.addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(k==='j')kick(6);if(k==='k')kick(12);if(k==='q'){let list=players.map((p,i)=>p.team===0?i:-1).filter(i=>i>=0);active=list[(list.indexOf(active)+1)%list.length]}});window.addEventListener('keyup',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='j')kick(6);else if(k==='k')kick(12);else if(k==='q'){active=(active+1)%10}else keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
document.getElementById('start').onclick=start;document.getElementById('pause').onclick=()=>{running=false;statusEl.textContent='일시정지'};document.getElementById('reset').onclick=reset;document.getElementById('home').onclick=()=>location.href='/';
reset();requestAnimationFrame(loop);
</script></body></html>
